<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://apis.google.com; connect-src 'self' https://firebasevertexai.googleapis.com https://firebaseappcheck.googleapis.com https://content-firebaseappcheck.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.googleapis.com https://recaptchaenterprise.googleapis.com https://www.google.com; frame-src 'self' https://www.google.com https://recaptcha.google.com https://accounts.google.com; img-src 'self' data:; style-src 'self'; font-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
</head>
<body>
<div id="wall"></div>
<script type="module" src="/src/main.ts"></script>
<!--
Embedding contract (S4, B21/B24): the wall is served from Firebase Hosting and embedded
by the extension panel in an iframe. The iframe MUST carry allow="language-model" in
static markup together with src (setting allow from script after src silently yields
"unavailable"). Hosting frame-ancestors is delivered via headers.json and lists
chrome-extension:// origins only, never "*". The extension lists this site in
externally_connectable for the T1 port and uses postMessage (T2) with exact-origin
checks for the embedded wall.
-->
</body>
</html>
